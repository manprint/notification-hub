version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifyhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/notifyhub-payloads &&
      mc anonymous set none local/notifyhub-payloads
      "
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
    command: bash deploy/api/entrypoint.sh
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
    command: celery -A app.tasks.celery_app worker -Q delivery --concurrency 4 --loglevel INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env

  beat:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env

  nginx:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

  mock-webhook:
    image: python:3.12-slim
    command: python scripts/mock_webhook.py
    ports:
      - "8899:8899"
    volumes:
      - ./scripts:/scripts:ro
    working_dir: /scripts
    profiles:
      - smoke

volumes:
  pgdata:
  miniodata:
