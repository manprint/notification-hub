# NotifyHub - stack di esercizio.
#
# Avvio:  cp .env.example .env  &&  docker compose up -d
#
# Le URL di .env puntano a localhost perche lo stesso file serve anche allo sviluppo
# fuori container. Qui sotto ogni servizio le sovrascrive con i nomi di servizio della
# rete Compose: env_file viene applicato prima di environment, quindi environment vince.
#
# Profili:
#   (default)  postgres, redis, minio, minio-init, migrate, api, worker, beat, nginx
#   smoke      mock-webhook, usato da scripts/smoke.sh
#
# Nessuna porta di servizio interno e pubblicata su 0.0.0.0: Postgres, Redis e MinIO
# restano raggiungibili solo dalla rete interna e la console MinIO solo da loopback,
# come richiede la spec sezione 10.4. L'unico ingresso pubblico e nginx.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: notifyhub
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifyhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [notifyhub]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [notifyhub]
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NOTIFYHUB_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${NOTIFYHUB_S3_SECRET_KEY:-minioadmin}
    ports:
      # sola console di amministrazione, solo da loopback
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [notifyhub]
    restart: unless-stopped

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${NOTIFYHUB_S3_ACCESS_KEY:-minioadmin} ${NOTIFYHUB_S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${NOTIFYHUB_S3_BUCKET:-notifyhub-payloads} &&
      mc anonymous set none local/${NOTIFYHUB_S3_BUCKET:-notifyhub-payloads}
      "
    networks: [notifyhub]
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment: &db_env
      DATABASE_URL_OWNER: postgresql+asyncpg://notifyhub_owner:${PG_OWNER_PASSWORD:-dev_owner}@postgres:5432/notifyhub
      DATABASE_URL_APP: postgresql+asyncpg://notifyhub_app:${PG_APP_PASSWORD:-dev_app}@postgres:5432/notifyhub
      DATABASE_URL_AUTH: postgresql+asyncpg://notifyhub_auth:${PG_AUTH_PASSWORD:-dev_auth}@postgres:5432/notifyhub
      DATABASE_URL_INGEST: postgresql+asyncpg://notifyhub_ingest:${PG_INGEST_PASSWORD:-dev_ingest}@postgres:5432/notifyhub
      DATABASE_URL_SYNC: postgresql+psycopg://notifyhub_app:${PG_APP_PASSWORD:-dev_app}@postgres:5432/notifyhub
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      NOTIFYHUB_S3_ENDPOINT: http://minio:9000
    networks: [notifyhub]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
    command: ["bash", "deploy/api/entrypoint.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *db_env
      NOTIFYHUB_WEBHOOK_HOST_ALLOWLIST: ${NOTIFYHUB_WEBHOOK_HOST_ALLOWLIST:-hooks.slack.com,chat.googleapis.com}
    expose:
      - "8000"
      - "9100"  # /metrics, mai instradata da nginx (spec 10.4)
    healthcheck:
      # curl non e presente in python:3.12-slim, si usa l'interprete.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [notifyhub]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-Q", "delivery", "--concurrency", "4", "--loglevel", "INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment: *db_env
    networks: [notifyhub]
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel", "INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env
    environment: *db_env
    networks: [notifyhub]
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [notifyhub]
    restart: unless-stopped

  mock-webhook:
    profiles: ["smoke"]
    image: python:3.12-slim
    command: ["python", "/scripts/mock_webhook.py"]
    ports:
      # lo smoke test interroga /_received da host, l'API lo raggiunge come mock-webhook:8899
      - "127.0.0.1:8899:8899"
    volumes:
      - ./scripts:/scripts:ro
    networks: [notifyhub]
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  notifyhub:
    driver: bridge
