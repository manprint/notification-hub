[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Gli engine SQLAlchemy async sono singleton di modulo (app/db/session.py), come
# in produzione: devono restare legati a un solo event loop per l'intera sessione
# di test, altrimenti asyncpg solleva "attached to a different loop" al secondo
# test che li usa (pytest-asyncio di default crea un loop per funzione).
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "unit: test senza dipendenze esterne",
    "integration: richiede i servizi di docker-compose.test.yml",
    "e2e: percorso completo attraverso l'app ASGI",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy async esegue il lavoro del driver dentro un greenlet (greenlet_spawn):
# senza dichiararlo, coverage.py non traccia le righe che girano la' dentro e
# riporta come "non coperto" codice che i test attraversano a ogni giro. Misurato:
# app/api/v1/auth.py passava da 32% a 54% sugli stessi 7 test. Un numero sbagliato
# e' peggio di nessun numero, perche' manda a scrivere test dove non servono e
# nasconde i buchi veri.
concurrency = ["greenlet", "thread"]
omit = [
    "app/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Pavimento verificato da `make cov`: una modifica che scende sotto fa fallire il
# gate invece di passare inosservata. Va alzato quando la copertura sale.
fail_under = 88
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
