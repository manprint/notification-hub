user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    server {
        listen 80;
        server_name _;

        # Static files for React SPA
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # API endpoints
        location /api/v1/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ingestion endpoint with buffering disabled
        # Without proxy_request_buffering off, nginx would accumulate the full 20MB
        # request body on disk before forwarding it, preventing the application from
        # enforcing per-receiver size limits early and rejecting oversized payloads
        # before they consume memory or storage.
        location /ingest/ {
            proxy_pass http://api:8000;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoints
        location /healthz {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
        }

        location /readyz {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
        }
    }
}
