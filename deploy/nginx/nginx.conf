user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Se davanti a questo nginx c'e' un altro reverse proxy che termina il TLS,
    # lo schema e il nome pubblici arrivano nei suoi X-Forwarded-*: passarli
    # oltre invece di sovrascriverli con $scheme/$host, altrimenti un'istanza
    # servita in https su un altro nome genera link http (link degli inviti,
    # delle notifiche, URL di ingestion, script wrapper scaricabile). Senza
    # header in ingresso valgono schema e host visti qui.
    map $http_x_forwarded_proto $notifyhub_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_host $notifyhub_forwarded_host {
        default $http_x_forwarded_host;
        ""      $http_host;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    # Nessuna versione di nginx nelle risposte.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        # Intestazioni di sicurezza: le location che definiscono un proprio add_header non le
        # ereditano, per questo la SPA non usa add_header (usa expires, che non le sostituisce).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Static files for React SPA. index.html non va messo in cache: dopo un rilascio
        # punta a file con hash nuovi, e una copia vecchia caricherebbe chunk che non esistono.
        location = /index.html {
            expires -1;
        }

        location / {
            try_files $uri /index.html;
        }

        # Asset con hash nel nome: cache lunga. Un file mancante deve essere 404, non l'index
        # servito come text/html (il caricamento dei moduli fallirebbe in silenzio).
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        # API endpoints
        location /api/v1/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $notifyhub_proto;
            proxy_set_header X-Forwarded-Host $notifyhub_forwarded_host;
        }

        # Ingestion endpoint with buffering disabled
        # Without proxy_request_buffering off, nginx would accumulate the full 20MB
        # request body on disk before forwarding it, preventing the application from
        # enforcing per-receiver size limits early and rejecting oversized payloads
        # before they consume memory or storage.
        location /ingest/ {
            proxy_pass http://api:8000;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $notifyhub_proto;
            proxy_set_header X-Forwarded-Host $notifyhub_forwarded_host;
        }

        # Health check endpoints
        location /healthz {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
        }

        location /readyz {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
        }
    }
}
