# NotifyHub - stack a container unico.
#
#   cd deploy/all-in-one
#   cp .env.example .env
#   docker compose -f docker-compose.all-in-one.yml up -d
#
# oppure, dalla radice del progetto:  make all-in-one-up
#
# Un solo servizio, un solo volume dati, un solo volume log. Il container
# contiene PostgreSQL, Redis, MinIO, API, worker Celery, beat Celery e nginx.

services:
  notifyhub:
    image: ${NOTIFYHUB_IMAGE:-ghcr.io/manprint/notification-hub}:${NOTIFYHUB_VERSION:-v0.0.1}
    container_name: notifyhub
    env_file: .env
    ports:
      # Unico ingresso pubblico: nginx.
      - "${HTTP_PORT:-80}:80"
      # Metriche e API S3 restano interne. Per esporle su loopback, togliere il
      # commento e mettere METRICS_BIND=0.0.0.0 / MINIO_BIND=0.0.0.0 nel .env.
      # - "127.0.0.1:9100:9100"
      # - "127.0.0.1:9000:9000"
    volumes:
      # Tutta la persistenza: postgres, redis, minio, config, stato, backup.
      - notifyhub-data:/data
      # Un file di log per servizio, piu' quello che si vede con docker logs.
      - notifyhub-logs:/logs
    # L'arresto ordinato ferma nginx, poi l'applicazione, poi PostgreSQL:
    # serve tempo, altrimenti Docker uccide il cluster a meta' checkpoint.
    stop_grace_period: 120s
    restart: unless-stopped
    # L'healthcheck e' gia' nell'immagine (verifica tutti i servizi e /readyz).
    # Qui si allunga solo la finestra di avvio, perche' al primo boot il
    # container esegue initdb, migrazioni e creazione del bucket.
    healthcheck:
      start_period: 300s

volumes:
  notifyhub-data:
  notifyhub-logs:
