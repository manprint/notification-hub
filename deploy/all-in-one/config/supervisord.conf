; NotifyHub all-in-one - orchestrazione dei servizi nel container unico.
;
; supervisord (non s6) perche' e' un solo processo Python gia' presente nel
; virtualenv dell'applicazione, espone uno stato interrogabile da
; supervisorctl (che e' quello che usa l'healthcheck) e gestisce priorita',
; riavvii e arresto ordinato senza aggiungere un altro strato di init.
;
; Ogni programma passa da notifyhub-svc, che instrada i log su
; /logs/<servizio>/<servizio>.log e su stdout con il prefisso "[servizio] - ".
; stdout_logfile=/dev/fd/9 e' lo stdout reale del container, che l'entrypoint
; mette da parte prima di incanalare il proprio in notifyhub-logpipe: senza,
; le righe gia' prefissate dai servizi passerebbero una seconda volta.
; Le variabili %(ENV_*)s sono esportate dall'entrypoint prima dell'exec.

[supervisord]
nodaemon=true
user=root
identifier=notifyhub
; I messaggi di supervisord escono su stdout (nodaemon) e li' li raccoglie
; notifyhub-logpipe come "[supervisor] - ...", scrivendoli in
; /logs/supervisor/supervisor.log: un secondo file qui sarebbe un doppione.
logfile=/dev/null
logfile_maxbytes=0
childlogdir=/logs/supervisor
pidfile=/run/notifyhub/supervisord.pid
loglevel=info
strip_ansi=true

[unix_http_server]
file=/run/notifyhub/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/notifyhub/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------------------
; infrastruttura
; ---------------------------------------------------------------------------

[program:postgres]
command=/usr/local/bin/notifyhub-svc postgres -- /usr/lib/postgresql/%(ENV_PG_MAJOR)s/bin/postgres -D /data/postgres
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=10
startretries=10
; SIGINT = fast shutdown: chiude le connessioni e fa il checkpoint.
stopsignal=INT
stopwaitsecs=120
stopasgroup=true
killasgroup=true
; HOME esplicito: supervisord cambia utente ma lascia HOME=/root, e asyncpg
; cerca $HOME/.postgresql/postgresql.key trovando un permission denied.
environment=HOME="/var/lib/postgresql",USER="postgres"
redirect_stderr=true
stdout_logfile=/dev/fd/9
stdout_logfile_maxbytes=0

[program:redis]
command=/usr/local/bin/notifyhub-svc redis -- /usr/bin/redis-server /run/notifyhub/redis.conf
user=notifyhub
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
; HOME esplicito: supervisord cambia utente ma lascia HOME=/root, e asyncpg
; cerca $HOME/.postgresql/postgresql.key trovando un permission denied.
environment=HOME="/opt/notifyhub",USER="notifyhub"
redirect_stderr=true
stdout_logfile=/dev/fd/9
stdout_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/notifyhub-svc minio -- /usr/local/bin/minio server /data/minio --address %(ENV_MINIO_BIND)s:9000
user=notifyhub
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
; HOME esplicito: supervisord cambia utente ma lascia HOME=/root, e asyncpg
; cerca $HOME/.postgresql/postgresql.key trovando un permission denied.
environment=HOME="/opt/notifyhub",USER="notifyhub"
redirect_stderr=true
stdout_logfile=/dev/fd/9
stdout_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; applicazione
; ---------------------------------------------------------------------------

[program:api]
command=/usr/local/bin/notifyhub-svc api --wait postgres,redis,minio -- /opt/notifyhub/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers %(ENV_UVICORN_WORKERS)s --proxy-headers --forwarded-allow-ips 127.0.0.1 --no-access-log
directory=/opt/notifyhub/app
user=notifyhub
priority=50
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
; HOME esplicito: supervisord cambia utente ma lascia HOME=/root, e asyncpg
; cerca $HOME/.postgresql/postgresql.key trovando un permission denied.
environment=HOME="/opt/notifyhub",USER="notifyhub"
redirect_stderr=true
stdout_logfile=/dev/fd/9
stdout_logfile_maxbytes=0

; /metrics resta su una porta separata e non viene mai instradata da nginx.
[program:metrics]
command=/usr/local/bin/notifyhub-svc metrics --wait postgres,redis -- /opt/notifyhub/venv/bin/uvicorn app.core.metrics:metrics_app --host %(ENV_METRICS_BIND)s --port 9100 --no-access-log
directory=/opt/notifyhub/app
user=notifyhub
priority=51
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
; HOME esplicito: supervisord cambia utente ma lascia HOME=/root, e asyncpg
; cerca $HOME/.postgresql/postgresql.key trovando un permission denied.
environment=HOME="/opt/notifyhub",USER="notifyhub"
redirect_stderr=true
stdout_logfile=/dev/fd/9
stdout_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/notifyhub-svc worker --wait postgres,redis,minio -- /opt/notifyhub/venv/bin/celery -A app.tasks.celery_app worker -Q delivery --concurrency %(ENV_WORKER_CONCURRENCY)s --loglevel %(ENV_LOG_LEVEL)s
directory=/opt/notifyhub/app
user=notifyhub
priority=60
autostart=true
autorestart=true
startsecs=15
startretries=5
; TERM = warm shutdown, il worker finisce i task in corso.
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
; HOME esplicito: supervisord cambia utente ma lascia HOME=/root, e asyncpg
; cerca $HOME/.postgresql/postgresql.key trovando un permission denied.
environment=HOME="/opt/notifyhub",USER="notifyhub"
redirect_stderr=true
stdout_logfile=/dev/fd/9
stdout_logfile_maxbytes=0

[program:beat]
command=/usr/local/bin/notifyhub-svc beat --wait postgres,redis -- /opt/notifyhub/venv/bin/celery -A app.tasks.celery_app beat --loglevel %(ENV_LOG_LEVEL)s --schedule /data/state/celerybeat-schedule --pidfile=
directory=/opt/notifyhub/app
user=notifyhub
priority=61
autostart=true
autorestart=true
startsecs=15
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
; HOME esplicito: supervisord cambia utente ma lascia HOME=/root, e asyncpg
; cerca $HOME/.postgresql/postgresql.key trovando un permission denied.
environment=HOME="/opt/notifyhub",USER="notifyhub"
redirect_stderr=true
stdout_logfile=/dev/fd/9
stdout_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; ingresso pubblico
; ---------------------------------------------------------------------------

[program:nginx]
command=/usr/local/bin/notifyhub-svc nginx --wait api -- /usr/sbin/nginx -c /run/notifyhub/nginx.conf -g "daemon off;"
user=root
priority=70
autostart=true
autorestart=true
startsecs=5
startretries=5
; QUIT = graceful shutdown, chiude dopo aver servito le richieste in corso.
stopsignal=QUIT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/9
stdout_logfile_maxbytes=0
