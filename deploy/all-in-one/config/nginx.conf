# NotifyHub all-in-one - nginx, unico ingresso pubblico del container.
#
# Template: l'entrypoint sostituisce __CLIENT_MAX_BODY__ e __API_PORT__ e
# scrive il risultato in /run/notifyhub/nginx.conf.
#
# access log ed error log vanno su stdout/stderr, dove notifyhub-svc li
# raccoglie per /logs/nginx/nginx.log e per il flusso di `docker logs`.

user notifyhub;
worker_processes auto;
pid /run/notifyhub/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    # Se davanti a questo nginx c'e' un altro reverse proxy che termina il TLS,
    # lo schema e il nome pubblici arrivano nei suoi X-Forwarded-*: passarli
    # oltre invece di sovrascriverli con $scheme/$host, altrimenti un'istanza
    # servita in https su un altro nome genera link http verso questo container
    # (link degli inviti, delle notifiche, URL di ingestion, script wrapper).
    # Senza header in ingresso valgono schema e host visti qui.
    map $http_x_forwarded_proto $notifyhub_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_host $notifyhub_forwarded_host {
        default $http_x_forwarded_host;
        ""      $http_host;
    }

    # I worker girano come notifyhub: le directory temporanee devono stare
    # dove quell'utente puo' scrivere, non nelle /var/lib/nginx del pacchetto.
    client_body_temp_path /run/notifyhub/nginx/client_body;
    proxy_temp_path /run/notifyhub/nginx/proxy;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size __CLIENT_MAX_BODY__;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    upstream notifyhub_api {
        server 127.0.0.1:__API_PORT__;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/notifyhub/html;

        # SPA React: gli asset con hash nel nome sono immutabili, index.html no.
        location / {
            try_files $uri /index.html;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location /api/v1/ {
            proxy_pass http://notifyhub_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $notifyhub_proto;
            proxy_set_header X-Forwarded-Host $notifyhub_forwarded_host;
            proxy_read_timeout 120s;
        }

        # Ingestion con buffering disattivato: senza, nginx accumulerebbe su
        # disco l'intero corpo da 20MB prima di inoltrarlo, impedendo
        # all'applicazione di applicare i limiti per receiver e di rifiutare
        # presto i payload sovradimensionati.
        location /ingest/ {
            proxy_pass http://notifyhub_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $notifyhub_proto;
            proxy_set_header X-Forwarded-Host $notifyhub_forwarded_host;
            proxy_read_timeout 120s;
        }

        location = /healthz {
            proxy_pass http://notifyhub_api;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /readyz {
            proxy_pass http://notifyhub_api;
            proxy_set_header Host $host;
            access_log off;
        }

        # /metrics resta interno (porta 9100), come nello stack Compose.
        location = /metrics {
            return 404;
        }
    }
}
